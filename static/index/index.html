<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际象棋智能检测系统</title>
    <!-- 引入外部CSS -->
    <link rel="stylesheet" href="/static/index/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Markdown解析库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.0/marked.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>国际象棋智能检测系统</h1>

        <!-- 导航按钮 -->
        <div class="container mt-4">
            <div class="row">
                <div class="col-12 text-center mb-4">
                    <h1 class="display-5">国际象棋分析系统</h1>
                    <div class="btn-group-lg" role="group" aria-label="功能切换">
                        <button type="button" class="btn btn-primary active" id="detection-btn">棋子识别</button>
                        <button type="button" class="btn btn-outline-primary" id="qa-btn">象棋知识问答</button>
                        <a href="/static/dashboard/dashboard.html" class="btn btn-outline-primary">
                            <i class="fas fa-history"></i> 历史记录
                        </a>
                    </div>
                </div>
            </div>

            <!-- 棋子识别区域 -->
            <div id="detection-section">
                <!-- 棋子识别功能内容 -->
                <div class="piece-selection">
                    <div class="select-all-container">
                        <div>
                            <span id="selectionCount">已选择 0 个类别</span>
                        </div>
                        <button class="btn" onclick="toggleSelectAll()">
                            <i class="fas fa-check-double"></i>
                            <span>全选/取消</span>
                        </button>
                    </div>

                    <div class="piece-group">
                        <!-- 白色棋子 -->
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="white_king">
                                <i class="fas fa-chess-king white-piece"></i>
                                白王
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="white_queen">
                                <i class="fas fa-chess-queen white-piece"></i>
                                白后
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="white_bishop">
                                <i class="fas fa-chess-bishop white-piece"></i>
                                白象
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="white_knight">
                                <i class="fas fa-chess-knight white-piece"></i>
                                白马
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="white_rook">
                                <i class="fas fa-chess-rook white-piece"></i>
                                白车
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="white_pawn">
                                <i class="fas fa-chess-pawn white-piece"></i>
                                白兵
                            </label>
                        </div>

                        <!-- 黑色棋子 -->
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="black_king">
                                <i class="fas fa-chess-king black-piece"></i>
                                黑王
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="black_queen">
                                <i class="fas fa-chess-queen black-piece"></i>
                                黑后
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="black_bishop">
                                <i class="fas fa-chess-bishop black-piece"></i>
                                黑象
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="black_knight">
                                <i class="fas fa-chess-knight black-piece"></i>
                                黑马
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="black_rook">
                                <i class="fas fa-chess-rook black-piece"></i>
                                黑车
                            </label>
                        </div>
                        <div class="piece-option">
                            <label>
                                <input type="checkbox" class="piece-checkbox" value="black_pawn">
                                <i class="fas fa-chess-pawn black-piece"></i>
                                黑兵
                            </label>
                        </div>
                    </div>
                </div>

                <div class="upload-section">
                    <p>拖动图片至此或点击上传</p>
                    <button id="uploadBtn" class="btn">
                        <i class="fas fa-cloud-upload-alt"></i>
                        选择图片
                    </button>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>

                <div id="loadingSection" class="hidden">
                    <div class="spinner"></div>
                    <p>正在分析图片...</p>
                </div>

                <div id="resultSection" class="result-section hidden" data-session-id="">
                    <h2><i class="fas fa-search"></i> 检测结果</h2>

                    <div class="image-container">
                        <canvas id="resultCanvas" class="result-canvas"></canvas>
                    </div>

                    <div class="action-buttons">
                        <button id="generateNotationBtn" class="btn">
                            <i class="fas fa-chess-board"></i>
                            生成棋谱
                        </button>
                    </div>
                    <div id="cornerSelectionModal" class="modal">
                      <div class="modal-content">
                        <div class="modal-header">
                          <h2>请选择棋盘四个角点</h2>
                          <span class="close-button">&times;</span>
                        </div>
                        <div class="modal-body">
                          <div class="selection-instructions">
                            <p>请依次点击棋盘的<strong>四个角点</strong>（顺序：左上、右上、右下、左下）</p>
                            <p>已选择: <span id="modalCornerCount">0</span>/4</p>
                            <div class="selection-actions">
                              <button id="modalResetBtn" class="btn">
                                <i class="fas fa-redo"></i> 重置角点
                              </button>
                              <button id="modalSubmitBtn" class="btn btn-primary" disabled>
                                <i class="fas fa-check"></i> 提交角点
                              </button>
                            </div>
                          </div>
                          <div class="image-selection-container">
                            <img id="selectionImage" src="" alt="棋盘图片" />
                            <!-- 这里会动态添加标记点 -->
                          </div>
                        </div>
                      </div>
                    </div>
                    <div id="notationResult" class="notation-result hidden">
                        <h3><i class="fas fa-scroll"></i> 生成的棋谱</h3>
                        <div class="notation-display">
                            <img id = "resultImage" class="result-image" src="" alt="棋谱">
                        </div>
                    </div>
                </div>

            </div>



            <!-- 问答部分 -->
            <div id="qa-section" style="display: none;">
                <div class="row justify-content-center">
                    <div class="col-md-10">
                        <div class="card chat-card">
                            <div class="card-header">
                                <h3>国际象棋知识问答 (Ollama)</h3>
                            </div>

                            <div class="card-body p-0">
                                <!-- 聊天历史显示区域 -->
                                <div id="chat-history" class="p-3 chat-container">
                                    <div class="welcome-message text-center">
                                        <div class="ai-avatar">
                                            <img src="/static/ai-avatar.png" alt="AI" onerror="this.src='/static/placeholder-avatar.png'">
                                        </div>
                                        <p>欢迎使用象棋知识问答助手！请输入您的问题。</p>
                                    </div>
                                </div>

                                <!-- 问题输入区 -->
                                <div class="chat-input-area p-3 border-top">
                                    <div class="input-group">
                                        <input type="text" id="question-input" class="form-control" placeholder="输入您的象棋问题...">
                                        <button class="btn btn-mic" type="button" id="mic-button">
                                            <i class="fas fa-microphone mic-icon"></i>
                                        </button>
                                        <button class="btn btn-input" type="button" id="send-question">
                                            <i class="fas fa-paper-plane"></i> 发送
                                        </button>
                                    </div>
                                    <div id="recognition-status" class="recognition-status hidden">
                                        <div class="pulse"></div>
                                        <span>正在聆听...</span>
                                    </div>

                                    <!-- 提示和建议 -->
                                    <div class="mt-3">
                                        <p class="text-muted small">提示：您可以询问关于国际象棋规则、著名棋手、开局策略等问题。</p>
                                        <div class="quick-questions">
                                            <button class="btn btn-sm btn-outline-secondary quick-question">什么是车轮战术？</button>
                                            <button class="btn btn-sm btn-outline-secondary quick-question">如何识别国际象棋中的白骑士？</button>
                                            <button class="btn btn-sm btn-outline-secondary quick-question">国际象棋的基本规则是什么？</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入JavaScript模块文件 -->
    <!-- 工具模块 -->
    <script src="/static/index/js/utils.js"></script>
    <!-- API交互模块 -->
    <script src="/static/index/js/api.js"></script>
    <!-- UI交互模块 -->
    <script src="/static/index/js/ui.js"></script>
    <!-- 检测功能模块 -->
    <script src="/static/index/js/detection.js"></script>
    <!-- 聊天功能模块 -->
    <script src="/static/index/js/chat.js"></script>
    <!-- 语音功能模块 -->
    <script src="/static/index/js/speech.js"></script>
    <!-- 主入口模块 -->
    <script src="/static/index/js/index.js"></script>
</body>
</html>
